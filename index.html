<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fiver</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Instrument+Serif:ital@0;1&display=swap">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* Layout: phone-first wizard, one step per screen. Cream paper, black text, wine ink for prices and the map. Titles are the brand lettering, set letter by letter. No boxes: hierarchy comes from the lettering, one checkered rule and whitespace. */
:root{
  --bg:#FFF7EB; --fg:#111111; --muted:#6B6660; --wine:#59211F; --soft:#F1E9DA; --soft2:#E6DCC9; --rule:#E7DDCE;
  --map-ground:#FFF7EB; --map-ink:#59211F; --map-block:rgba(89,33,31,.07); --map-road:#FFF7EB; --map-green:rgba(89,33,31,.06); --map-campus:rgba(89,33,31,.14); --map-label:#6B5A58; --pin-free:#59211F; --pin-other:#2B2622;
  --body:"Josefin Sans",Arial,Helvetica,sans-serif; --serif:"Instrument Serif",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#141311; --fg:#FFF7EB; --muted:#B8B1A4; --wine:#D08E88; --soft:#211E19; --soft2:#2C2822; --rule:#2E2A26;
    --map-ground:#1A1917; --map-ink:#D9B8B2; --map-block:rgba(217,184,178,.08); --map-road:#1A1917; --map-green:rgba(217,184,178,.07); --map-campus:rgba(217,184,178,.16); --map-label:#B8B1A4; --pin-free:#D08E88; --pin-other:#D9D2C2; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#141311; --fg:#FFF7EB; --muted:#B8B1A4; --wine:#D08E88; --soft:#211E19; --soft2:#2C2822; --rule:#2E2A26;
  --map-ground:#1A1917; --map-ink:#D9B8B2; --map-block:rgba(217,184,178,.08); --map-road:#1A1917; --map-green:rgba(217,184,178,.07); --map-campus:rgba(217,184,178,.16); --map-label:#B8B1A4; --pin-free:#D08E88; --pin-other:#D9D2C2; color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:300;font-size:16px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--wine);outline-offset:4px;border-radius:6px}
h1,h2,h3,p{margin:0}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:20px;padding-block:14px 28px;gap:16px}

/* brand lettering */
.ms{display:inline-flex;align-items:flex-start;flex-wrap:wrap;row-gap:calc(var(--ms) * 0.18);line-height:1;--ms:32px;vertical-align:baseline;max-width:100%}
.ms .ms-w{display:inline-flex;align-items:flex-start;gap:0 calc(var(--ms) * 0.09);white-space:nowrap}
.ms img{display:block;width:auto;flex:none;user-select:none;-webkit-user-drag:none}
.ms .ms-sp{display:inline-block;width:calc(var(--ms) * 0.40);flex:none}
.ms b{font-weight:600;font-size:var(--ms);line-height:1}
.ms.wine img{filter:brightness(0) saturate(100%) invert(12%) sepia(40%) saturate(2400%) hue-rotate(335deg) brightness(90%)}
.ms.cream img{filter:brightness(0) invert(.96)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ms:not(.cream) img{filter:brightness(0) invert(.96)} :root:not([data-theme="light"]) .ms.wine img{filter:brightness(0) invert(.75) sepia(.3) saturate(2)} }
:root[data-theme="dark"] .ms:not(.cream) img{filter:brightness(0) invert(.96)}
:root[data-theme="dark"] .ms.wine img{filter:brightness(0) invert(.75) sepia(.3) saturate(2)}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.wordmark{height:46px;width:auto;display:block}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .wordmark{filter:invert(.95)} }
:root[data-theme="dark"] .wordmark{filter:invert(.95)}
.tagline{font-weight:400;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.dots{display:flex;gap:7px;padding-bottom:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--soft2)}
.dots i.on{background:var(--fg);transform:scale(1.35)}
.dots i.done{background:var(--fg);opacity:.35}
.check{height:8px;background-image:linear-gradient(45deg,var(--wine) 25%,transparent 25%,transparent 75%,var(--wine) 75%),linear-gradient(45deg,var(--wine) 25%,transparent 25%,transparent 75%,var(--wine) 75%);background-size:8px 8px;background-position:0 0,4px 4px}

/* type roles */
.k{font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.lead{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.3;color:var(--muted)}
.body{font-weight:300;font-size:15px;color:var(--fg)}
.meta{font-weight:400;font-size:13px;color:var(--muted);letter-spacing:.02em}
.step{display:flex;flex-direction:column;gap:16px}
.block{display:flex;flex-direction:column;gap:8px}

/* navigation arrows */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px}
.arrbtn{display:inline-flex;align-items:center;gap:10px;color:var(--fg);padding:6px 2px}
.arrbtn .arr{width:54px;height:20px;display:block}
.arrbtn.big .arr{width:70px;height:26px}
.arrbtn .arr path{fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.arrbtn.big{color:var(--wine)}
.arrbtn[disabled]{opacity:.3;cursor:default}
.arrbtn:not([disabled]):active .arr{transform:translateX(3px)}
.arrbtn.back:not([disabled]):active .arr{transform:translateX(-3px)}

/* soft pills (chips, small actions) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-inline:-20px;padding-inline:20px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;background:var(--soft);color:var(--fg);font-weight:400;font-size:14px;letter-spacing:.02em;user-select:none;white-space:nowrap;flex:none}
.chip input{position:absolute;opacity:0;width:0;height:0}
.chip.on{background:var(--fg);color:var(--bg)}
.chip.tchip{position:relative;overflow:hidden}
.chip.tchip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.chip .ico-inline{width:16px;height:16px}
.ico-inline path,.ico-inline circle{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-weight:400;font-size:13px;align-self:flex-start}

/* category tiles */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);padding:6px 2px;font-weight:400;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tile .ico{height:80px;width:auto;max-width:100%;display:block;opacity:.5;transition:opacity .15s,transform .15s}
.tile.on .ico{opacity:1;transform:scale(1.08)}
.tile.on{color:var(--wine)}
.tile.on .lbl{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tile .ico{filter:brightness(0) invert(.92)} }
:root[data-theme="dark"] .tile .ico{filter:brightness(0) invert(.92)}

/* sliders: a thin line and a dot */
.slider{display:flex;flex-direction:column;gap:6px}
.slider input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:linear-gradient(to right,var(--wine) 0 var(--pct,50%),var(--soft2) var(--pct,50%) 100%);outline:none;margin:14px 0 6px}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--fg);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--wine)}
.slider input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--fg);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--wine)}
.slider input[type=range]::-moz-range-track{height:2px;background:var(--soft2)}
.slider input[type=range]::-moz-range-progress{height:2px;background:var(--wine)}
.ticks{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400}

/* map */
.mapbox{position:relative;margin-inline:-20px}
.mapbox::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.22;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .13 0 0 0 0 .12 0 0 0 .5 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");background-size:180px 180px}
.mapbox>.mapctl{z-index:3}
.mapbox svg{width:100%;height:auto;display:block;background:var(--map-ground);touch-action:manipulation}
#rmap{width:100%;height:320px;background:var(--map-ground)}
.mapctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px;z-index:2}
.mapctl button{width:34px;height:34px;border-radius:12px;background:var(--bg);color:var(--fg);font-weight:600;font-size:17px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.mapLbl{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;fill:var(--map-label)}
.roadLbl{font-family:var(--body);font-weight:400;font-size:10px;letter-spacing:.1em;text-transform:uppercase;fill:var(--map-label)}
.campusLbl{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;fill:var(--map-ink)}
.pin{cursor:pointer}
.pin text{font-family:var(--body);font-weight:600;font-size:13px;fill:var(--bg);pointer-events:none}
.pin.dim{opacity:.45}
.pin.top .ring{stroke:var(--wine);stroke-width:3;fill:none;stroke-dasharray:5 4}
.you{fill:var(--bg);stroke:var(--wine);stroke-width:4}
.youHalo{fill:var(--wine);opacity:.18}
@media (prefers-reduced-motion:no-preference){.youHalo{animation:halo 2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes halo{0%{transform:scale(.5);opacity:.35}100%{transform:scale(1.6);opacity:0}}}
.mapnote{font-size:12px;color:var(--muted);padding-top:6px}
/* maplibre essentials (inlined so the page works without its stylesheet) */
.maplibregl-map{position:relative;overflow:hidden;font-family:var(--body)}
.maplibregl-canvas-container,.maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-canvas{outline:0}
.maplibregl-marker{position:absolute;top:0;left:0;will-change:transform}
.maplibregl-ctrl-attrib{position:absolute;right:0;bottom:0;font-size:10px;background:rgba(255,247,235,.8);padding:2px 6px;color:#6B6660}
.maplibregl-ctrl-attrib a{color:inherit}
.maplibregl-ctrl-bottom-right{position:absolute;right:0;bottom:0;z-index:2}
.rpin{background:var(--pin-other);color:#FFF7EB;font-weight:600;font-size:12px;letter-spacing:.02em;padding:5px 9px;border-radius:999px;border:2px solid #FFF7EB;box-shadow:0 1px 4px rgba(0,0,0,.18);white-space:nowrap;cursor:pointer}
.rpin.free{background:var(--pin-free)}
.rpin.top{box-shadow:0 0 0 3px var(--wine),0 1px 4px rgba(0,0,0,.18)}
.rpin.dim{background:transparent;border:2px solid var(--pin-other);width:12px;height:12px;padding:0;border-radius:50%;box-shadow:none}
.ryou{width:22px;height:22px;border-radius:50%;background:#FFF7EB;border:4px solid #59211F;box-shadow:0 0 0 6px rgba(89,33,31,.18)}

/* results */
.hero{display:flex;flex-direction:column;gap:6px;padding-block:4px}
.hero .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.hero.empty{align-items:center;text-align:center;gap:10px}
.hero.empty img{height:120px;width:auto}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hero.empty img{filter:brightness(0) invert(.92)} }
:root[data-theme="dark"] .hero.empty img{filter:brightness(0) invert(.92)}
.ai{white-space:pre-wrap;font-weight:300;font-size:15px;border-left:2px solid var(--wine);padding-left:12px;margin-top:6px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;text-align:left;width:100%;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item.dim{opacity:.45}
.item h3{font-weight:400;font-size:15px;line-height:1.25}
.item .walk{font-weight:600;font-size:13px;white-space:nowrap;text-align:right;color:var(--fg);letter-spacing:.04em}
.item .walk small{display:block;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.saved{display:inline-block;font-size:12px;font-weight:600;color:var(--wine);margin-left:8px}

/* sheet */
.sheetWrap{position:fixed;inset:0;background:rgba(18,18,18,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);color:var(--fg);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px}
.close{position:sticky;top:0;align-self:flex-end;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.prices{display:flex;flex-direction:column;margin-top:6px}
.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);color:var(--muted);font-size:14px}
.pr.mine{color:var(--fg)}
.pr .why{display:block;font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:8px;vertical-align:middle}
.badge.ok{color:var(--wine)}

/* details, settings, footer */
details summary{cursor:pointer;color:var(--wine);font-weight:400;font-size:14px;letter-spacing:.04em}
details textarea,details input[type=password],details input[type=text]{width:100%;border:0;border-bottom:1px solid var(--wine);border-radius:0;background:transparent;color:var(--fg);padding:8px 0;margin-top:8px;font-weight:300}
details textarea{min-height:90px;resize:vertical}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.foot{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
.foot .estd{font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px;color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.step{animation:in .18s ease-out}@keyframes in{from{opacity:.6;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

const MS_CAP=136.5;

function msRender(root){
  (root||document).querySelectorAll("[data-ms]").forEach(el=>{
    if(el.dataset.msDone===el.dataset.ms)return;el.dataset.msDone=el.dataset.ms;el.innerHTML="";
    const text=(el.dataset.ms||"").normalize("NFC").toUpperCase();
    text.split(" ").forEach((word,i)=>{
      if(i){const s=document.createElement("i");s.className="ms-sp";el.appendChild(s);}
      if(!word)return;
      const w=document.createElement("span");w.className="ms-w";
      for(const ch of word){
        const g=MS[ch];if(!g){const t=document.createElement("b");t.textContent=ch;w.appendChild(t);continue;}
        const img=document.createElement("img");img.src="data:image/png;base64,"+g.b64;img.alt="";img.draggable=false;
        img.style.height="calc(var(--ms) * "+(g.h/MS_CAP).toFixed(3)+")";img.style.marginTop="calc(var(--ms) * "+(g.top).toFixed(3)+")";
        w.appendChild(img);
      }
      el.appendChild(w);
    });
  });
}

function cardName(id){return (CARDS.find(c=>c.id===id)||{}).name||id;}
// price ladder for an offer: [{label, price, mine:boolean, note}]
function ladder(p,o,t){
  const rows=[];
  if(o.cat==="deal"&&p.deal){const d=DEALS[p.deal];rows.push({label:"No card",price:d.base,mine:true,status:d.status});
    for(const c in d.with)rows.push({label:cardName(c),price:d.with[c],mine:state.cards.has(c),status:d.status});
  }else{
    rows.push({label:o.price===0?"Everyone":"No card",price:o.price,mine:true,status:o.status});
    if(o.with)for(const c in o.with){const w=o.with[c];const ok=!w.days||w.days.includes(t.day);rows.push({label:cardName(c),price:w.price,mine:state.cards.has(c)&&ok,status:"est",note:w.label+(ok?"":" (not today)"),promo:!!w.promo});}
  }
  return rows;
}
function bestPrice(p,o,t){
  const rows=ladder(p,o,t).filter(r=>r.mine&&!r.promo);
  const best=rows.reduce((a,b)=>b.price<a.price?b:a,rows[0]);
  return {price:best.price,label:best.label==="No card"||best.label==="Everyone"?"":"with "+best.label,status:best.status};
}

/* ---------- RANK ---------- */
function metres(a,b){const R=6371000,toR=x=>x*Math.PI/180;const dLat=toR(b.lat-a.lat),dLon=toR(b.lon-a.lon);const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function allPlaces(){return PLACES.concat(state.added);}
function rank(){
  const t=selectedTime();const here=state.where||VENUES[0];
  const rows=[];
  for(const p of allPlaces()){
    const offers=p.offers.filter(o=>state.cats.has(o.cat));
    if(!offers.length)continue;
    const o=isOpen(p,t);const m=metres(here,p);const walk=Math.max(1,Math.round(m/80));
    let best=null;
    for(const of of offers){const bp=bestPrice(p,of,t);if(!best||bp.price<best.pr.price)best={of,pr:bp};}
    const eat=best.of.cat==="deal"||best.of.cat==="coffee"||best.of.cat==="snack"?6:12;
    const fits=o.open&&best.pr.price<=state.budget+1e-9&&(walk*2+eat)<=state.mins&&o.closesIn>walk;
    let score=best.pr.price*10+walk*0.6; if(best.of.cat==="free")score-=5; if(!p.ucl&&best.of.cat!=="deal")score+=0.5;
    const ladderRows=ladder(p,best.of,t);
    const saved=ladderRows.find(r=>r.label==="No card")?Math.max(0,(ladderRows.find(r=>r.label==="No card").price-best.pr.price)):0;
    rows.push({p,o,m,walk,eat,fits,score,of:best.of,pr:best.pr,saved,t});
  }
  const fit=rows.filter(r=>r.fits).sort((a,b)=>a.score-b.score);
  const rest=rows.filter(r=>!r.fits).sort((a,b)=>(a.o.open===b.o.open?0:(a.o.open?-1:1))||a.score-b.score);
  return {fit,rest,t,here};
}

  if(typeof s.budget==="number")state.budget=s.budget; if(typeof s.mins==="number")state.mins=s.mins;
  if(Array.isArray(s.added))state.added=s.added; if(s.setupDone)state.setupDone=true;
}catch(e){}
function persist(){try{localStorage.setItem("fiver.v4",JSON.stringify({cards:[...state.cards],cats:[...state.cats],budget:state.budget,mins:state.mins,added:state.added,setupDone:state.setupDone}));}catch(e){}}

/* ---------- TIME ---------- */
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function nowParts(){const d=new Date();return {day:d.getDay(),minutes:d.getHours()*60+d.getMinutes(),date:d};}
function selectedTime(){
  const n=nowParts();const off=state.dayOff||0;const date=new Date(n.date);date.setDate(date.getDate()+off);
  const day=date.getDay();const minutes=state.minute===null?(off===0?n.minutes:12*60):state.minute;
  const iso=date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");
  return {day,minutes,dateISO:iso,isNow:off===0&&state.minute===null,label:(off===0?"Today":DAYS[day]+" "+date.getDate())+" · "+(state.minute===null&&off===0?"now":fmt(minutes))};
}
function hm(s){const [h,m]=s.split(":").map(Number);return h*60+m;}
function fmt(m){if(m>=1439)return "midnight";const h=Math.floor(m/60),mm=m%60;return (h%12||12)+(mm?":"+String(mm).padStart(2,"0"):"")+(h<12?"am":"pm");}
function openWindow(p,day){if(p.when)return [hm(p.when.start),hm(p.when.end)];const h=p.hours||{};const k=day===0?h.sun:day===6?h.sat:h.wk;return k?[hm(k[0]),hm(k[1])]:null;}
function isOpen(p,t){
  if(p.when&&p.when.date!==t.dateISO)return {open:false,reason:"not that day"};
  const w=openWindow(p,t.day); if(!w)return {open:false,reason:"closed that day"};
  if(t.minutes<w[0])return {open:false,reason:"opens "+fmt(w[0])};
  if(t.minutes>=w[1])return {open:false,reason:"closed at "+fmt(w[1])};
  const allDay=w[0]===0&&w[1]>=1439;
  return {open:true,closesIn:w[1]-t.minutes,closes:fmt(w[1]),allDay};
}

    '<p class="lead">'+esc(row.of.item)+' · '+(row.o.open?(row.o.allDay?'open 24h':'open, closes '+row.o.closes):row.o.reason)+'</p>'+
    '<p class="meta">'+breakdown(row)+'</p>'+(row.p.why?'<p class="body">'+esc(row.p.why)+'</p>':'')+
    '<div class="chips"><a class="chip" href="'+gmaps(row.p)+'" target="_blank" rel="noopener">'+PIN+' Walk there</a></div>'+
    '<div class="k" style="margin-top:10px">Your price</div><div class="prices">'+rows.map(x=>'<div class="pr'+(x.mine&&!x.promo?" mine":"")+'"><div>'+esc(x.label)+(x.mine&&x.label!=="No card"&&x.label!=="Everyone"?' · you have it':'')+(x.note?'<span class="why">'+esc(x.note)+'</span>':'')+'</div><span class="ms'+(x.mine&&!x.promo?' wine':'')+'" data-ms="'+money(x.price)+'" style="--ms:13px"></span></div>').join("")+'</div>'+
    (row.p.ucl&&state.cards.has("foodatucl")?'<p class="note">Food at UCL app: 1 point = £0.05 on every purchase; 9 stamps on barista drinks, 10th free; first coffee free on download.</p>':'')+
    (pstatus?'<p class="note">'+pstatus+'</p>':'')+
    (row.p.offers.length>1?'<div class="k" style="margin-top:10px">Also here</div><p class="note">'+row.p.offers.filter(o=>o!==row.of).map(o=>esc(o.item)+(o.price!=null||row.p.deal?" · "+money(bestPrice(row.p,o,t).price):"")).join(" · ")+'</p>':'')+
    '</div></div>';
  msRender(host);
  const wrap=document.getElementById("sheetWrap");const close=()=>{host.innerHTML="";};
  document.getElementById("closeSheet").onclick=close;wrap.addEventListener("click",e=>{if(e.target===wrap)close();});
  document.addEventListener("keydown",function onk(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",onk);}});
  document.getElementById("closeSheet").focus();
}

const RSTYLE={version:8,glyphs:"https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",sources:{omt:{type:"vector",url:"https://tiles.openfreemap.org/planet"}},layers:[

function circlePoly(lat,lon,r){const pts=[];for(let i=0;i<=64;i++){const a=i/64*2*Math.PI;pts.push([lon+r/111320/Math.cos(lat*Math.PI/180)*Math.cos(a),lat+r/110540*Math.sin(a)]);}return {type:"Feature",geometry:{type:"Polygon",coordinates:[pts]}};}
function buildRealMap(container,opts){
  const here=state.where||VENUES[0];
  if(rmap){try{rmap.remove();}catch(e){}rmap=null;}rmarkers=[];
  rmap=new maplibregl.Map({container,style:RSTYLE,center:[here.lon,here.lat],zoom:15.4,minZoom:9,maxZoom:18.5,attributionControl:false});
  rmap.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:"© OpenFreeMap © OpenMapTiles © OpenStreetMap"}),"bottom-right");
  rmap.on("load",()=>{
    if(state.where){rmap.addSource("ring",{type:"geojson",data:circlePoly(here.lat,here.lon,800)});rmap.addLayer({id:"ring",type:"line",source:"ring",paint:{"line-color":"#59211F","line-width":1.5,"line-dasharray":[3,3],"line-opacity":0.7}});}
  });
  if(opts&&opts.tap){rmap.on("click",e=>{state.where={lat:e.lngLat.lat,lon:e.lngLat.lng,label:"where you tapped"};opts.tap();});}
  if(state.where){const y=document.createElement("div");y.className="ryou";rmarkers.push(new maplibregl.Marker({element:y}).setLngLat([here.lon,here.lat]).addTo(rmap));}
  if(opts&&opts.pins){const top=new Set(opts.top||[]);const bounds=new maplibregl.LngLatBounds([here.lon,here.lat],[here.lon,here.lat]);
    for(const row of opts.pins){const e=document.createElement("div");
      if(!row.fits){e.className="rpin dim";e.title=row.p.name;}
      else{e.className="rpin"+(row.of.cat==="free"?" free":"")+(top.has(row.p.id)?" top":"");e.textContent=money(row.pr.price).replace(".00","");bounds.extend([row.p.lon,row.p.lat]);}
      e.addEventListener("click",ev=>{ev.stopPropagation();openSheet(row);});
      rmarkers.push(new maplibregl.Marker({element:e,anchor:"center"}).setLngLat([row.p.lon,row.p.lat]).addTo(rmap));}
    if(opts.pins.some(r=>r.fits))rmap.fitBounds(bounds,{padding:48,maxZoom:16,duration:0});}
  const ctl=document.createElement("div");ctl.className="mapctl";ctl.innerHTML='<button type="button" aria-label="Zoom in">+</button><button type="button" aria-label="Zoom out">−</button><button type="button" aria-label="Centre on me" style="font-size:12px">me</button>';
  const [bIn,bOut,bMe]=ctl.querySelectorAll("button");bIn.onclick=()=>rmap.zoomIn();bOut.onclick=()=>rmap.zoomOut();bMe.onclick=()=>rmap.flyTo({center:[here.lon,here.lat],zoom:15});
  container.parentElement.appendChild(ctl);
}

/* ---------- CLAUDE: inside claude.ai via sample, elsewhere via the API key ---------- */
let sampleFn=null;
async function askClaude(prompt,o){o=o||{};
  if(sampleFn){if(o.json)return sampleFn.json(prompt,{modelTier:"quick"});const r=await sampleFn(prompt,{modelTier:"quick",onText:o.onText});return r.text;}
  const key=getKey();if(!key)throw {code:"no_key"};
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:400,messages:[{role:"user",content:prompt}]})});
  if(!res.ok)throw {code:res.status===401?"not_granted":"upstream_error"};
  const j=await res.json();const text=(j.content||[]).map(c=>c.text||"").join("");
  if(o.json){const m=text.match(/\{[\s\S]*\}/);return JSON.parse(m?m[0]:text);}return text;
}
function claudeAvailable(){return !!sampleFn||!!getKey();}
function wireAsk(d,r){
  const b=d.querySelector("#ask"),hint=d.querySelector("#askHint"),out=d.querySelector("#aiOut");if(!b)return;
  if(!claudeAvailable()){b.hidden=true;return;}b.hidden=false;
  b.onclick=async()=>{b.disabled=true;out.hidden=false;out.textContent="Thinking…";const t=r.t;
    const top=r.fit.slice(0,5).map(x=>({name:x.p.name,price:x.pr.price,walkMin:x.walk,item:x.of.item,closes:x.o.closes||"",note:x.p.why||"",cardUsed:x.pr.label||""}));
    const prompt="You help a UCL student decide where to eat. It is "+DAYS[t.day]+" "+fmt(t.minutes)+". They are at "+(state.where||VENUES[0]).label+", want "+[...state.cats].join(", ")+", have £"+state.budget+" and "+state.mins+" minutes, and hold these cards: "+([...state.cards].map(cardName).join(", ")||"none")+".\nRanked options (cheapest first, all open and within reach):\n"+JSON.stringify(top)+"\n\nIn at most 3 short sentences, plain English, say which to pick and why, and name one alternative. No bullet points, no preamble.";
    try{const text=await askClaude(prompt,{onText:({text})=>{out.textContent=text;}});out.textContent=text;}
    catch(e){out.textContent=e&&e.text?e.text:"";hint.textContent=e&&e.code==="not_granted"?"Claude wasn’t allowed here.":(e&&e.code==="rate_limited"?"Too many asks. Try again in a minute.":"Claude didn’t answer. The ranking above still stands.");}
    finally{b.disabled=false;}};
}
function wireEvents(d){
  const btn=d.querySelector("#evtBtn"),note=d.querySelector("#evtNote"),ta=d.querySelector("#evtText"),sel=d.querySelector("#evtVenue");
  sel.innerHTML=VENUES.map(v=>'<option value="'+v.id+'">'+esc(v.name)+'</option>').join("");
  if(!claudeAvailable()){btn.disabled=true;note.textContent="Reading invites needs Claude: open this page in claude.ai, or add an API key under My cards.";return;}
  btn.onclick=async()=>{const text=ta.value.trim();if(!text){note.textContent="Paste the event text first.";return;}btn.disabled=true;note.textContent="Reading…";
    const venue=VENUES.find(v=>v.id===sel.value)||VENUES[0];
    const prompt='Read this event invite and reply with only a JSON object: {"freeFood": boolean, "what": string, "date": "YYYY-MM-DD" or "", "start": "HH:MM" or "", "end": "HH:MM" or "", "title": string}. freeFood is true only if food or drink is offered at no cost to attendees. Today is '+selectedTime().dateISO+'. If the end time is missing, use start + 2 hours.\n\nEVENT:\n'+text.slice(0,6000);
    try{const j=await askClaude(prompt,{json:true});
      if(!j||!j.freeFood){note.textContent="Claude read it: no free food mentioned. Not added.";}
      else if(!j.date||!j.start){note.textContent="Claude found food but no date or time. Add the date to the text and try again.";}
      else{state.added.push({id:"add-"+Date.now(),name:j.title||"Event",lat:venue.lat,lon:venue.lon,when:{date:j.date,start:j.start,end:j.end||addHours(j.start,2)},addr:venue.name,status:"added",offers:[{cat:"free",item:j.what||"free food",price:0,status:"added"}],why:"Added from a pasted invite."});persist();ta.value="";note.textContent="Added: "+(j.what||"free food")+" on "+j.date+" at "+j.start+".";render();}
    }catch(e){note.textContent=e&&e.code==="invalid_json"?"Claude’s answer wasn’t readable. Try again.":(e&&e.code==="not_granted"?"Claude wasn’t allowed here.":"Claude didn’t answer. Try again later.");}
    finally{btn.disabled=false;}};
}
function addHours(hhmm,h){const m=hm(hhmm)+h*60;return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}
